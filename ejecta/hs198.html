---
layout: default
title: Model SW19.8
---

<link rel="stylesheet" href="{{ site.baseurl }}/public/main.css">

<!-- Three.js Script -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<!-- OrbitControls.js Script -->
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<button class="back-button" onclick="history.back()">Back</button>

<h2>Model SW19.8</h2>

<!-- Define the container -->
<div
    class="threejs-container"
    data-model="hs19_8"
    data-timesteps='["{{ site.baseurl }}/media/shocks/hs19_8_00.gltf", 
                     "{{ site.baseurl }}/media/shocks/hs19_8_01.gltf", 
                     "{{ site.baseurl }}/media/shocks/hs19_8_02.gltf", 
                     "{{ site.baseurl }}/media/shocks/hs19_8_03.gltf", 
                     "{{ site.baseurl }}/media/shocks/hs19_8_04.gltf", 
                     "{{ site.baseurl }}/media/shocks/hs19_8_05.gltf", 
                     "{{ site.baseurl }}/media/shocks/hs19_8_06.gltf", 
                     "{{ site.baseurl }}/media/shocks/hs19_8_07.gltf"]'
>
    <div class="threejs-canvas"></div>

    <!-- Time Step Slider -->
    <div class="slider-container">
        <input
            type="range"
            id="timeSlider"
            min="0"
            max="2"
            value="0"
            step="1"
        />
        <div id="slider-labels"></div>
    </div>

        <button
            class="shock-button"
            id="toggle_mesh1"
            style="background-color: cyan"
        >
            Forward shock
        </button>

    <div id="container">
        <button
            class="background-button"
            id="whiteb"
            style="border: 1px solid #333; 
                   background-color: #f1f1f1;"
        ></button>
        <button
            class="background-button"
            id="blackb"
            style="border: 1px solid #f1f1f1; background-color: #333"
        ></button>
    </div>

    <div
        id="loading-text"
        style="
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: black;
        "
    >
        <h2>Loading...</h2>
    </div>

</div>

<!-- Load JavaScript Files -->
<script src="{{ site.baseurl }}/media/setupScene.js"></script>
<script src="{{ site.baseurl }}/media/shocks/loadModel.js"></script>
