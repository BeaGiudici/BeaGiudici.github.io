<h2> High mass - Low energy models </h2>
<!-- Div for Three.js Canvas -->
<div id="frame-container"></div>
  <!-- <iframe class="iframe-content" id="hs131" src="media/hs131_elements.html" scrolling="no"></iframe> -->
  <script>
    const models = [
      {file: 'elements/hs163_elements_all.glb', title: 'Model SW16.3'},
      {file: 'elements/hs182_elements_all.glb', title: 'Model SW18.2'},
      {file: 'elements/hs208_elements_all.glb', title: 'Model SW20.8'},
      {file: 'elements/hs21_elements_all.glb', title: 'Model SW21.0'},
    ];

    const container = document.getElementById('frame-container');

    models.forEach(model => {
      // Add title element
      const titleElement = document.createElement('h3');
      titleElement.textContent = model.title;
      //titleElement.style.textAlign = 'center'; // Optional: center align titles
      //titleElement.style.margin = '10px 0';
      
      const div = document.createElement('div');
      div.className = 'threejs-container';

      // Create iframe for the model
      const iframe = document.createElement('iframe');
      iframe.className = 'iframe-content';
      iframe.src = `media/elements.html?model=${encodeURIComponent(model.file)}`;
      iframe.scrolling = 'no';

      container.appendChild(titleElement);
      div.appendChild(iframe);
      container.appendChild(div);
    });
</script>
