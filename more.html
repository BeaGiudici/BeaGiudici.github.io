  <div>
    <iframe class="iframe-content" id="myIframe" src="kpca_rbf_3d_global_elements.html" scrolling="no"></iframe>
  
    <script>
        const iframe = document.getElementById('myIframe');

        window.addEventListener('message', (event) => {
            // Optional: Validate the event.origin if you know where the iframe is hosted
            const { width, height } = event.data;
            iframe.style.width = width + 'px';
            iframe.style.height = height + 'px';
        });
    </script>
    </div>
