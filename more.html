<h2> 3D Morphologies </h2>

<h3> Model SW13.1 </h3>
<!-- Div for Three.js Canvas -->
<div class="threejs-container">
  <div id="threejs-canvas"></div>
</div>

<!-- Three.js Script -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<!-- OrbitControls.js Script -->
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
  // Set up basic Three.js Scene
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer();
  renderer.setSize(690, 690); // Set size (adjust to your container's dimensions)
  scene.background = new THREE.Color(0xffffff);
  renderer.setClearColor(0xffffff, 1); // RGB (255, 255, 255), alpha = 1
  
  // Append the renderer to the 'threejs-canvas' div
  document.getElementById('threejs-canvas').appendChild(renderer.domElement);

  // Load GLTF Model
  const loader = new THREE.GLTFLoader();
  loader.load('media/hs131.gltf', function(gltf) {
    scene.add(gltf.scene); // Add the loaded model to the scene
    // Optionally, if model scale or position is off, adjust:
    gltf.scene.scale.set(1e-15, 1e-15, 1e-15);  // Optional: adjust size of the model
    gltf.scene.position.set(0, 0, 0);  // Optional: position of the model

      // Optional: Add a helper to view the bounding box of the model
    const box = new THREE.Box3().setFromObject(gltf.scene);
    const size = new THREE.Vector3();
      box.getSize(size);
      console.log("Model size:", size); // Log model dimensions
  }, undefined, function(error) {
    console.error("Error loading the model:", error); // Handle errors
  });

  // Add ambient light and a directional light to illuminate the scene
  const ambientLight = new THREE.AmbientLight(0x404040, 1); // Soft ambient light
  scene.add(ambientLight);
  
  const directionalLight = new THREE.DirectionalLight(0xffffff, 2);  // Strong directional light (like sunlight)
  directionalLight.position.set(0.5, -0.5, -0.5).normalize();
  scene.add(directionalLight);

  // Adjust camera position
  camera.position.z = 40;

  // Initialize OrbitControls (allows for dragging, rotating, and zooming)
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; // Enable smoother controls
    controls.dampingFactor = 0.25;
    controls.screenSpacePanning = false; // Set this to 'false' if you want to disable panning
    controls.maxPolarAngle = Math.PI / 2; // Limit vertical rotation
  
  // Create an animation loop to render the scene and update it every frame
  function animate() {
      requestAnimationFrame(animate);
       controls.update(); 
    renderer.render(scene, camera);
  }
  
  animate();
  
  // Handle window resizing (maintain rendering size on resize)
  window.addEventListener('resize', () => {
    const width = document.getElementById('threejs-canvas').clientWidth;
    const height = document.getElementById('threejs-canvas').clientHeight;
    renderer.setSize(width, height);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
  });
</script>
