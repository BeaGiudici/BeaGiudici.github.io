---
layout: default
title: Home
---

<div>
    <h1>Welcome to my personal page!</h1>
    <p>
        This is a personal page for me to share information about myself and my
        work. Have a nice stay!
    </p>
</div>

<div class="posts">
    {% for post in paginator.posts %}
    <div class="post">
        <h2 class="post-title">{{ post.title }}</h2>
        {{ post.content }}
    </div>
    {% endfor %}
</div>
