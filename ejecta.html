<h2>Model WH12.5</h2>

<!-- Define the container -->
<div class="threejs-container">
  <div id="threejs-canvas"></div>
  
  <!-- Time Step Slider -->
  <input type="range" id="timeSlider" min="0" max="2" value="0" step="1" 
      style="position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 300px;">

  <div id="legend">
    <button class="shock-button" id="toggle_mesh1" style="background-color: red;">Forward shock</button>
    <button class="shock-button" id="toggle_mesh2" style="background-color: yellow;">Reverse shock</button>
  </div>

  <div id="container">
    <button class="background-button" id="whiteb" style="border: 1px solid #333; background-color: #f1f1f1;"></button>
    <button class="background-button" id="blackb" style="border: 1px solid #f1f1f1; background-color: #333;"></button>
  </div>

  <div id="loading-text" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: black;">
    <h2>Loading...</h2>
  </div>

  <script>
    // Define the model file paths here
    const timeSteps = [
        "media/shocks/w12_5_sb1.gltf",
        "media/shocks/w12_5_sb2.gltf",
    ];
  
    // Ensure `timeSteps` is available globally
    window.timeSteps = timeSteps;
  </script>
  

  <!-- Load JavaScript Files -->
  <script src="media/setupScene.js"></script>
  <script src="media/shocks/loadModel.js"></script>
  
</div>
