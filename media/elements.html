<!-- Div for Three.js Canvas -->
<div class="threejs-container">
  <div id="threejs-canvas"></div>
</div>

<div id="legend" style="position: absolute; top: 10px; left: 20px;">
  <ul style="list-style: none; padding: 0; margin: 0;">
    <li><button class="element-button" id="toggle_mesh0" style="background-color: yellow;">He4</button></li>
    <li><button class="element-button" id="toggle_mesh1" style="background-color: cyan;">C12</button></li>
    <li><button class="element-button" id="toggle_mesh2" style="background-color: blue;">O16</button></li>
    <li><button class="element-button" id="toggle_mesh3" style="background-color: magenta;">Si28</button></li>
    <li><button class="element-button" id="toggle_mesh4" style="background-color: red;">Ni56</button></li>
  </ul>
</div>

<div id="loading-text" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: black;">
  <h2>Loading...</h2>
</div>

<!-- Three.js Script -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<!-- OrbitControls.js Script -->
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
  // Define model filename (passed as a parameter in more.html)
  const urlParams = new URLSearchParams(window.location.search);
  const modelFilename = urlParams.get('model');

  // Show loading text initially
  const loadingText = document.getElementById('loading-text');
  loadingText.style.display = 'block';  // Ensure the text is visible before loading starts

  // Set up basic Three.js Scene
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer();
  const container = document.getElementById("threejs-canvas");
  container.appendChild(renderer.domElement);
  renderer.setSize(window.innerWidth, window.innerHeight); // Set size (adjust to container's dimensions)
  scene.background = new THREE.Color(0xffffff);

  const meshes = {}; // Store meshes for toggling visibility

  // Load GLTF Model
  const loader = new THREE.GLTFLoader();
  loader.load(modelFilename, function(gltf) {
    loadingText.style.display = 'none';  // Hide the loading text once the model is loaded
    const model = gltf.scene; // The loaded GLTF scene
    scene.add(model); // Add the model to the scene
    const elementSettings = {
	    mesh0: {opacity: 0.6}, 
      mesh1: {opacity: 0.8}, 
      mesh2: {opacity: 0.8}, 
      mesh3: {opacity: 0.8}, 
      mesh4: {opacity: 0.8},
    };

    model.traverse((node) => {
      //console.log("Node:", node.name);
      if (node.isMesh && elementSettings[node.name]) {
        // Store the mesh for toggling later
        meshes[node.name] = node;

        // Apply initial material settings
        node.material.transparent = true;
        node.material.opacity = elementSettings[node.name].opacity;
        node.material.needsUpdate = true;

        // Use alphaMap if applicable
        if (node.material.map) {
          node.material.alphaMap = node.material.map;
        }
      }
    });
    console.log("Model loaded successfully!");
    // Optionally, if model scale or position is off, adjust:
    gltf.scene.scale.set(1e-15, 1e-15, 1e-15);  // Optional: adjust size of the model
    gltf.scene.position.set(0, 0, 0);  // Optional: position of the model

    // Optional: Add a helper to view the bounding box of the model
    const box = new THREE.Box3().setFromObject(gltf.scene);
    const size = new THREE.Vector3();
    box.getSize(size);
    //console.log("Model size:", size); // Log model dimensions
  
  }, undefined, function(error) {
    console.error("Error loading the model:", error); // Handle errors
  });

  // Add interactive legend
  // Add event listeners for toggle buttons
  for (let i = 0; i <= 4; i++) { // Loop from 0 to 4 for mesh0 to mesh4
    const meshName = `mesh${i}`;
    const toggleButton = document.getElementById(`toggle_${meshName}`); // Fetch button by ID

    if (toggleButton) {
      toggleButton.addEventListener("click", () => {
        if (meshes[meshName]) {
          const mesh = meshes[meshName];

          // Toggle visibility
          mesh.visible = !mesh.visible;

          // Update the opacity of the legend toggle to indicate visibility
          if (!mesh.visible) {
            toggleButton.style.opacity = '0.5'; // Fade out when hidden
          } else {
            toggleButton.style.opacity = '1'; // Show full color when visible
          }

          console.log(`${meshName} visibility: ${mesh.visible}`);
        }
      });
    }
  }

  // Add ambient light and a directional light to illuminate the scene
  const ambientLight = new THREE.AmbientLight(0x404040, 1); // Soft ambient light
  scene.add(ambientLight);
  
  const directionalLight = new THREE.DirectionalLight(0xffffff, 2);  // Strong directional light (like sunlight)
  directionalLight.position.set(1,1,1).normalize();
  scene.add(directionalLight);

  // Adjust camera position
  camera.position.z = -20;

  // Initialize OrbitControls (allows for dragging, rotating, and zooming)
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; // Enable smoother controls
    controls.dampingFactor = 0.25;
    controls.screenSpacePanning = false; // Set this to 'false' if you want to disable panning
    // controls.maxPolarAngle = Math.PI / 2; // Limit vertical rotation
  
  // Create an animation loop to render the scene and update it every frame
  function animate() {
      requestAnimationFrame(animate);
       controls.update(); 
    renderer.render(scene, camera);
  }
  
  animate();
  
  // Handle window resizing (maintain rendering size on resize)
  window.addEventListener('resize', () => {
    const width = document.getElementById('threejs-canvas').clientWidth;
    const height = document.getElementById('threejs-canvas').clientHeight;
    renderer.setSize(width, height);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
  });
</script>

<style>
  .threejs-canvas canvas {
    display: block; /* Remove margin that can cause issues */
  }

  .element-button {
    margin: 5px;
    color: black;
    width: 50px;
    height: 50px;
    border: 1px solid black;
    border-radius: 50%;
  }
</style>
